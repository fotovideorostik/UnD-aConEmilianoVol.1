<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ver el vídeo en YouTube · FotoVideoRostik</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #eceef1;
    --card: #ffffff;
    --ink: #15181c;
    --muted: #5b626b;
    --accent: #e0241b;
    --accent-ink: #ffffff;
    --line: #d5d9de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215;
      --card: #1a1d21;
      --ink: #f1f3f5;
      --muted: #9aa2ab;
      --accent: #ff4a3f;
      --accent-ink: #14100f;
      --line: #2a2e34;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 20px;
    line-height: 1.45;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px 14px 22px;
  }
  .thumb {
    position: relative;
    display: block;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg {
    position: absolute; inset: 0; margin: auto;
    width: 64px; height: 64px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
  }
  h1 {
    font-size: 1.35rem;
    line-height: 1.2;
    margin: 18px 6px 6px;
    letter-spacing: -0.01em;
  }
  p { margin: 0 6px; color: var(--muted); font-size: .95rem; }
  .open {
    display: block;
    margin: 18px 6px 0;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .open:active { transform: scale(.98); }
  .open:focus-visible, .web:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }
  .help {
    margin: 16px 6px 0;
    font-size: .9rem;
    color: var(--muted);
  }
  .web { color: var(--ink); font-weight: 600; }
  #ig-tip { display: none; margin-top: 10px; }
  #ig-tip.show { display: block; }
  footer {
    margin: 18px 6px 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: .85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <a class="thumb" id="thumb" href="https://www.youtube.com/watch?v=TECGzmpKicE" aria-label="Vídeo en YouTube">
    <img src="https://i.ytimg.com/vi/TECGzmpKicE/hqdefault.jpg" alt="" onerror="this.style.display='none'">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="32" fill="rgba(0,0,0,.6)"/>
      <path d="M26 20v24l20-12z" fill="#fff"/>
    </svg>
  </a>

  <h1>Tu vídeo está en YouTube</h1>
  <p>Toca el botón y se abrirá en la app de YouTube.</p>

  <a class="open" id="open" href="https://www.youtube.com/watch?v=TECGzmpKicE">Abrir en YouTube</a>

  <div class="help">
    ¿No se ha abierto? <a class="web" id="web" href="https://www.youtube.com/watch?v=TECGzmpKicE">Verlo en el navegador</a>
    <div id="ig-tip">Si sigues en Instagram, toca los tres puntos de arriba y elige «Abrir en el navegador».</div>
  </div>

  <footer>SIT Granollers</footer>
</main>

<script>
(function () {
  var ID = "TECGzmpKicE";
  var WEB = "https://www.youtube.com/watch?v=" + ID;
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  var appUrl = WEB;
  if (isAndroid) {
    // Intent de Android: abre la app de YouTube y, si no está, cae a la web.
    appUrl = "intent://www.youtube.com/watch?v=" + ID +
      "#Intent;package=com.google.android.youtube;scheme=https;" +
      "S.browser_fallback_url=" + encodeURIComponent(WEB) + ";end";
  } else if (isIOS) {
    // Esquema propio de la app de YouTube en iOS.
    appUrl = "youtube://www.youtube.com/watch?v=" + ID;
  }

  var open = document.getElementById("open");
  var thumb = document.getElementById("thumb");
  open.setAttribute("href", appUrl);
  thumb.setAttribute("href", appUrl);

  if (/Instagram|FBAN|FBAV/i.test(ua)) {
    document.getElementById("ig-tip").className = "show";
  }
})();
</script>
</body>
</html>
